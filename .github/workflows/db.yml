name: Database

on:
  pull_request:
  push:
    branches: [main]

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: winnow
          POSTGRES_PASSWORD: winnow
          POSTGRES_DB: winnow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U winnow -d winnow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://winnow:winnow@localhost:5432/winnow
      DATABASE_URL_UNPOOLED: postgres://winnow:winnow@localhost:5432/winnow
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm db:seed
      - run: pnpm --filter @winnow/web exec tsx src/server/db/verify.ts
      - run: pnpm exec vitest run apps/web/src/server/auth/ownership.test.ts
