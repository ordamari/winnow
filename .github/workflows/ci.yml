name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: winnow
          POSTGRES_PASSWORD: winnow
          POSTGRES_DB: winnow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U winnow -d winnow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://winnow:winnow@localhost:5432/winnow
      DATABASE_URL_UNPOOLED: postgres://winnow:winnow@localhost:5432/winnow
      BETTER_AUTH_SECRET: e2e-better-auth-secret-at-least-32-chars
      BETTER_AUTH_URL: http://127.0.0.1:3000
      E2E_TEST: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @winnow/web exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm test:e2e
